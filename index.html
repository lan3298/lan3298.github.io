<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共享苹果ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 整合响应式字体样式到 Tailwind 配置，无冗余独立 style 标签 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontSize: {
                        'base-responsive': ['clamp(16px, 2vw, 20px)'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            body {
                @apply text-base-responsive;
            }
        }
    </style>
    <!-- 放置umami统计脚本（defer属性，适合在head中加载） -->
    <script defer src="https://umami.680898.xyz/script.js" data-website-id="d7457845-b5e7-4987-aca6-fa9d62581646"></script>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-blue-600 text-white py-5 shadow-md">
        <div class="container mx-auto px-4">
            <p class="text-lg" id="update-time">最后更新：加载中...</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <div id="loading" class="flex justify-center items-center py-10">
            <p class="text-gray-600">正在加载...</p>
        </div>

        <div id="channel-content" class="space-y-5 hidden"></div>

        <div id="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg shadow-md hidden"></div>
    </main>

    <script src="script.js"></script>
    <!-- 放置chatway小部件脚本（async属性，适合在body末尾加载） -->
    <script id="chatway" async="true" src="https://cdn.chatway.app/widget.js?id=Afi0i40d8BrK"></script>
</body>
</html>
